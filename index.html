er view from \u003cSubject1> (swordsman)'s front-right, the camera planted low on the mud. Through sheets of rain and swaying tall grass at frame centre, \u003cSubject2> (cyborg) advances with heavy, steady, menacing steps, his mechanical joints glistening wet, sword held ready in a low guard. As \u003cSubject1> (swordsman) closes the distance at full sprint, \u003cSubject2> (cyborg) unleashes a powerful downward diagonal slash without hesitation, the blade cutting rain as it arcs. \u003cSubject1> (swordsman) twists his body sharply, dropping his shoulder and sliding his lead foot to flash past the strike at close range, then drives his own dull steel blade horizontally across \u003cSubject2> (cyborg)'s armored torso; the sword bites with a heavy metallic rebound, throwing a brief, sparse shower of real metal sparks and a visible jolt up \u003cSubject1> (swordsman)'s arms before the two spring apart a half-step. \u003cthudding mechanical footfalls in mud, a heavy whoosh of blade displacing rain, a loud dull clang of steel on armor, brief metallic scrape, rain hissing>\n\n4.0–7.0 seconds, A rapid-fire montage of extremely short cuts begins, each shot lasting only a fraction of a second and linked by hard whip-pans and foreground reed occlusions. From a slightly high angled wide view above the path, \u003cSubject2> (cyborg) presses forward relentlessly, delivering continuous horizontal sweeps, overhead chops, reverse-angle slashes, and close-range pursuit cuts with no flourish, while \u003cSubject1> (swordsman) circles and changes direction around him in tight arcs through the mud. A close handheld shot from over \u003cSubject2> (cyborg)'s rear shoulder shows one heavy swing after another hammering past inches from \u003cSubject1> (swordsman), who ducks his head, drops his weight, rotates his hips, and glides his feet to slip just beyond each blade edge. A low-angle close shot catches \u003cSubject1> (swordsman) sliding low on the wet ground as \u003cSubject2> (cyborg)'s sword shears rain just above his scalp and beside his shoulder, then snapping quick counter-cuts into \u003cSubject2> (cyborg)'s ribs, waist, and arm joints, each impact producing a hard metallic jolt and small real sparks. Extreme close-ups flash in quick succession: a dull blade edge scraping across dark armor plate, a mechanical forearm tensing and rotating as it swings, \u003cSubject1> (swordsman)'s muddy boot sole stamping into a puddle to reverse direction, raindrops and mud flecks exploding off swinging cloth and steel, and the two fighters brushing past each other shoulder-to-shoulder before separating. \u003crapid overlapping clangs and scrapes of steel on metal, squelching mud under quick feet, heavy blade whooshes cutting rain, cloth and straw hat flapping, continuous drumming rain>\n\n7.0–10.0 seconds, The montage cuts to a new dynamic side angle, framing the two fighters at mid-distance along the path of \u003cScene1> (marshland path). \u003cSubject2> (cyborg) suddenly plants his lead foot, winds up with both hands on his sword hilt, and unleashes a devastating horizontal-to-diagonal cleave with enormous force. \u003cSubject1> (swordsman) raises his long sword in a two-handed block to meet the strike; the moment the blades collide, the impact visibly hammers through his arms and body, lifting him off his feet and hurling him backward through the rain. He tumbles through the air, robes and hat trailing, and crashes into the muddy path several paces away, rolling hard across the wet ground in a spray of dark water and loose reeds, his sword still gripped in his hand as mud and rainwater splash around him. \u003ca thunderous metallic impact, a sharp grunt of exertion, body slamming into wet mud, splashing water, rain continuing to hammer down>\n\n10.0–15.0 seconds, Without slowing, the sequence drives into a continuous fast chain with whip-pans and tight foreground grass occlusions. \u003cSubject2> (cyborg) closes the gap instantly and raises his sword
